        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* 顶部状态栏 */
        .status-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-left h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .status-left .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .status-right {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: bold;
        }

        .badge-success {
            background: #10b981;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8fafc;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
            font-size: 14px;
        }

        /* 搜索和筛选 */
        .filter-section {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-input,
        .filter-select {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .filter-input:focus,
        .filter-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        .filter-input {
            min-width: 250px;
        }

        .filter-select {
            min-width: 150px;
            cursor: pointer;
        }

        /* 表格 */
        .table-section {
            padding: 30px;
            overflow-x: auto;
        }

        .news-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .news-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .news-table th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }

        .news-table td {
            padding: 15px 12px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: top;
        }

        .news-table tbody tr:hover {
            background: #f8fafc;
            transition: background 0.2s;
        }

        .news-table tbody tr:nth-child(even) {
            background: #fafafa;
        }

        /* 重要性标签 */
        .importance-high {
            background: #fef2f2;
            color: #dc2626;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

        .importance-medium {
            background: #fffbeb;
            color: #d97706;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

        .importance-low {
            background: #f0fdf4;
            color: #16a34a;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

        /* 链接样式 */
        .source-link {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            word-break: break-all;
        }

        .source-link:hover {
            text-decoration: underline;
        }

        /* 标题样式 */
        .news-title {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .news-summary {
            color: #64748b;
            line-height: 1.6;
            font-size: 13px;
        }

        /* 关键词标签 */
        .keyword-tag {
            display: inline-block;
            background: #e0e7ff;
            color: #4338ca;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin: 2px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state p {
            font-size: 18px;
        }

        /* 页脚 */
        .footer {
            background: #f8fafc;
            padding: 20px 30px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #e2e8f0;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .status-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 20px;
            }

            .filter-group {
                flex-direction: column;
            }

            .filter-input,
            .filter-select {
                width: 100%;
            }

            .table-section {
                padding: 15px;
            }

            .news-table {
                font-size: 12px;
            }

            .news-table th,
            .news-table td {
                padding: 10px 8px;
            }
        }

        /* 打印样式 */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
            }

            .filter-section {
                display: none;
            }
        }
    </style>
</head>

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            populateFilters();
            renderTable(NEWS_DATA);
            updateStats();
        });

        // 填充筛选器
        function populateFilters() {
            const sources = [...new Set(NEWS_DATA.map(item => item.source))];
            const categories = [...new Set(NEWS_DATA.map(item => item.category))];

            const sourceSelect = document.getElementById('filterSource');
            sources.forEach(source => {
                const option = document.createElement('option');
                option.value = source;
                option.textContent = source;
                sourceSelect.appendChild(option);
            });

            const categorySelect = document.getElementById('filterCategory');
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = CATEGORY_MAP[cat] || cat;
                categorySelect.appendChild(option);
            });
        }

        // 应用筛选
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sourceFilter = document.getElementById('filterSource').value;
            const categoryFilter = document.getElementById('filterCategory').value;
            const importanceFilter = document.getElementById('filterImportance').value;

            let filtered = NEWS_DATA.filter(item => {
                const matchSearch = !searchTerm ||
                    item.title.toLowerCase().includes(searchTerm) ||
                    item.summary.toLowerCase().includes(searchTerm) ||
                    item.keywords.some(k => k.toLowerCase().includes(searchTerm));

                const matchSource = !sourceFilter || item.source === sourceFilter;
                const matchCategory = !categoryFilter || item.category === categoryFilter;
                const matchImportance = !importanceFilter || item.importance === importanceFilter;

                return matchSearch && matchSource && matchCategory && matchImportance;
            });

            renderTable(filtered);
        }

        // 渲染表格
        function renderTable(data) {
            const tbody = document.getElementById('newsTableBody');
            const emptyState = document.getElementById('emptyState');

            if (data.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            tbody.innerHTML = data.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>
                        <div class="news-title">${item.title}</div>
                    </td>
                    <td>
                        <div class="news-summary">${item.summary}</div>
                        <div style="margin-top:8px;">
                            ${item.keywords.map(k => `<span class="keyword-tag">${k}</span>`).join('')}
                        </div>
                    </td>
                    <td><strong>${item.source}</strong></td>
                    <td>${CATEGORY_MAP[item.category] || item.category}</td>
                    <td><span class="importance-${item.importance === '高' ? 'high' : item.importance === '中' ? 'medium' : 'low'}">${item.importance}</span></td>
                    <td><a href="${item.url}" target="_blank" class="source-link">查看原文 →</a></td>
                </tr>
            `).join('');
        }

        // 更新统计
        function updateStats() {
            const high = NEWS_DATA.filter(item => item.importance === '高').length;
            const medium = NEWS_DATA.filter(item => item.importance === '中').length;
            const low = NEWS_DATA.filter(item => item.importance === '低').length;
            const categories = [...new Set(NEWS_DATA.map(item => item.category))].length;

            document.getElementById('totalCount').textContent = NEWS_DATA.length;
            document.getElementById('highCount').textContent = high;
            document.getElementById('mediumCount').textContent = medium;
            document.getElementById('lowCount').textContent = low;
            document.getElementById('categoryCount').textContent = categories;
        }
