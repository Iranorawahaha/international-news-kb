<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>双语速览</title>
<script src="https://unpkg.com/@mozilla/readability@0.5.0/Readability.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.header{background:#1a1a2e;color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:18px;font-weight:600}
.header .badge{font-size:11px;background:rgba(255,255,255,0.15);padding:3px 10px;border-radius:12px}
.container{max-width:600px;margin:0 auto;padding:20px}
.url-bar{display:flex;gap:8px;margin-bottom:16px}
.url-bar input{flex:1;padding:12px 14px;border:2px solid #ddd;border-radius:10px;font-size:14px;outline:none;transition:border .2s}
.url-bar input:focus{border-color:#1a1a2e}
.url-bar button{padding:12px 20px;background:#1a1a2e;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .1s}
.url-bar button:active{transform:scale(0.97)}
.url-bar button:disabled{opacity:0.5;cursor:not-allowed}
.hint{font-size:12px;color:#999;margin-bottom:20px}
.progress{display:none;background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.08)}
.progress.active{display:block}
.progress .step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;color:#999}
.progress .step.done{color:#16a34a}
.progress .step.current{color:#1a1a2e;font-weight:600}
.progress .step .icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.progress .step.done .icon{background:#dcfce7;color:#16a34a}
.progress .step.current .icon{background:#e8eaff;color:#1a1a2e;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.result{display:none}
.result.active{display:block}
.preview-wrap{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin-bottom:16px}
.preview-wrap img{width:100%;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(0.97)}
.btn-primary{background:#1a1a2e;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-outline{background:#fff;color:#333;border:1px solid #ddd}
.error{display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:16px;margin-bottom:16px;font-size:13px;color:#991b1b}
.error.active{display:block}

/* 双语渲染预览区（截图前隐藏，截图时展示） */
.render-area{position:fixed;left:-9999px;top:0;width:720px;background:#faf9f6;font-family:Georgia,"Noto Serif SC",serif;z-index:9999}
.render-area .st{display:inline-block;font-size:12px;color:#555;background:#eee;padding:3px 14px;border-radius:4px;margin-bottom:24px;font-family:-apple-system,sans-serif}
.render-area .te{font-size:26px;font-weight:700;line-height:1.35;color:#111;margin-bottom:10px}
.render-area .tz{font-size:18px;font-weight:500;line-height:1.5;color:#333;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid #ddd}
.render-area .meta{display:flex;align-items:center;gap:16px;font-size:13px;color:#666;margin-bottom:28px;font-family:-apple-system,sans-serif;flex-wrap:wrap}
.render-area .meta .rt{background:#e8e8e8;padding:2px 10px;border-radius:3px;font-weight:600;color:#444;white-space:nowrap}
.render-area .pb{margin-bottom:22px;padding-bottom:18px;border-bottom:1px dashed #e4e4e4}
.render-area .pb:last-child{border-bottom:none}
.render-area .en{font-size:17px;color:#1a1a1a;line-height:1.9;margin-bottom:10px}
.render-area .zh{font-size:14px;color:#555;line-height:1.85;padding-left:14px;border-left:3px solid #d0d0d0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.render-area .ft{margin-top:48px;padding-top:24px;border-top:2px solid #ddd;font-size:12px;color:#999;font-family:-apple-system,sans-serif}
.render-area .ft a{color:#555}
.render-area .ft .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.render-area .ft .logo{font-weight:700;color:#111;font-size:13px}
.render-area .hi{margin-bottom:28px}
.render-area .hi img{width:100%;height:auto;border-radius:8px;display:block}
.render-area .ex{font-size:15px;color:#444;line-height:1.75;margin-bottom:6px;font-style:italic}
.render-area .ez{font-size:14px;color:#555;line-height:1.75;margin-bottom:28px}

.manual-fallback{display:none;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:16px;margin-bottom:16px}
.manual-fallback.active{display:block}
.manual-fallback h3{font-size:14px;color:#92400e;margin-bottom:8px}
.manual-fallback p{font-size:12px;color:#a16207;margin-bottom:10px;line-height:1.6}
.manual-fallback textarea{width:100%;min-height:200px;padding:10px;border:1px solid #fde68a;border-radius:6px;font-size:12px;font-family:Georgia,serif;line-height:1.6;resize:vertical;outline:none}
.manual-fallback textarea:focus{border-color:#f59e0b}
.manual-fallback .actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.manual-fallback input[type=text]{width:100%;padding:8px 10px;border:1px solid #fde68a;border-radius:6px;font-size:13px;margin-bottom:8px;outline:none}
</style>
</head>
<body>

<div class="header">
  <h1>📋 双语速览</h1>
  <span class="badge">客户端版</span>
</div>

<div class="container">
  <!-- 输入区 -->
  <div class="url-bar">
    <input type="url" id="urlInput" placeholder="粘贴外媒报道链接（SCMP / WSJ / NYT / BBC...）" />
    <button id="goBtn" onclick="startPipeline()">生成截图</button>
  </div>
  <div class="hint">在浏览器内完成：抓取 → 翻译 → 渲染 → 截图 · 约 15-30 秒</div>

  <!-- 进度 -->
  <div class="progress" id="progress">
    <div class="step" id="step1"><span class="icon">1</span> CORS 代理抓取页面</div>
    <div class="step" id="step2"><span class="icon">2</span> 提取正文</div>
    <div class="step" id="step3"><span class="icon">3</span> Google Translate 翻译</div>
    <div class="step" id="step4"><span class="icon">4</span> 渲染双语版面</div>
    <div class="step" id="step5"><span class="icon">5</span> 生成截图</div>
  </div>

  <!-- 错误 -->
  <div class="error" id="error"></div>

  <!-- 手动粘贴 fallback（所有代理都失败时显示） -->
  <div class="manual-fallback" id="manualFallback">
    <h3>📋 手动粘贴原文（终极兜底）</h3>
    <p>所有自动抓取都失败了（可能被付费墙/反爬拦截）。请在浏览器里打开原文，<strong>选中正文部分复制</strong>，然后粘贴到下面。系统会继续生成双语截图。</p>
    <input type="text" id="manualTitle" placeholder="原文标题" />
    <input type="text" id="manualByline" placeholder="作者 / 信源（可选）" />
    <input type="text" id="manualUrl" placeholder="原文链接（可选）" />
    <textarea id="manualText" placeholder="粘贴原文正文（支持纯文本或 HTML）"></textarea>
    <div class="actions">
      <button class="btn btn-primary" onclick="processManual()">生成双语截图</button>
      <button class="btn btn-outline" onclick="closeManual()">取消</button>
    </div>
  </div>

  <!-- 结果 -->
  <div class="result" id="result">
    <div class="preview-wrap">
      <img id="previewImg" alt="双语长截图预览" />
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="downloadBtn" onclick="downloadImage()">⬇️ 下载截图</button>
      <button class="btn btn-green" id="copyBtn" onclick="copyImage()">📋 复制图片</button>
      <button class="btn btn-outline" id="newBtn" onclick="resetUI()">🔄 重新生成</button>
    </div>
  </div>

  <!-- 双语渲染隐藏区 -->
  <div class="render-area" id="renderArea"></div>
</div>

<script>
// ===================== 状态 =====================
let generatedImage = null;

function resetUI() {
  document.getElementById('progress').classList.remove('active');
  document.getElementById('result').classList.remove('active');
  document.getElementById('error').classList.remove('active');
  document.getElementById('manualFallback').classList.remove('active');
  document.getElementById('renderArea').innerHTML = '';
  document.getElementById('goBtn').disabled = false;
  document.getElementById('goBtn').textContent = '生成截图';
  generatedImage = null;
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = '❌ ' + msg;
  el.classList.add('active');
  document.getElementById('goBtn').disabled = false;
  document.getElementById('goBtn').textContent = '生成截图';

  // 如果是抓取失败，自动展开手动粘贴面板
  if (msg.includes('代理') || msg.includes('抓取') || msg.includes('HTTP 4') || msg.includes('HTTP 5')) {
    document.getElementById('manualUrl').value = document.getElementById('urlInput').value;
    document.getElementById('manualFallback').classList.add('active');
    // 自动滚动到面板
    setTimeout(() => {
      document.getElementById('manualFallback').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);
  }
}

function closeManual() {
  document.getElementById('manualFallback').classList.remove('active');
}

function resetManual() {
  document.getElementById('manualTitle').value = '';
  document.getElementById('manualByline').value = '';
  document.getElementById('manualUrl').value = '';
  document.getElementById('manualText').value = '';
  closeManual();
}

// 处理手动粘贴的文本
async function processManual() {
  const title = document.getElementById('manualTitle').value.trim();
  const byline = document.getElementById('manualByline').value.trim();
  const url = document.getElementById('manualUrl').value.trim() || '手动粘贴';
  const rawText = document.getElementById('manualText').value.trim();

  if (!rawText) {
    alert('请粘贴原文内容');
    return;
  }

  resetUI();
  initSteps();
  document.getElementById('progress').classList.add('active');
  document.getElementById('goBtn').disabled = true;
  document.getElementById('goBtn').textContent = '处理中...';
  document.getElementById('error').classList.remove('active');

  const startTime = Date.now();

  try {
    // Step 1: 跳过（手动粘贴）
    stepCurrent(1);
    await new Promise(r => setTimeout(r, 200));
    stepDone(1);

    // Step 2: 解析粘贴的内容
    stepCurrent(2);
    // 智能解析：如果是 HTML 则提取文本，否则按段落分割
    let paragraphs;
    if (rawText.trim().startsWith('<')) {
      const doc = new DOMParser().parseFromString(rawText, 'text/html');
      paragraphs = Array.from(doc.querySelectorAll('p, h2, h3, li'))
        .map(el => el.textContent.trim())
        .filter(t => t.length > 15);
    } else {
      paragraphs = rawText.split(/\n\s*\n+/)
        .map(p => p.trim())
        .filter(p => p.length > 15);
    }

    if (paragraphs.length === 0) {
      throw new Error('粘贴的内容没有有效段落');
    }

    const article = {
      title: title || '手动粘贴的文章',
      byline: byline,
      excerpt: paragraphs[0].substring(0, 200),
      siteName: '手动粘贴',
      content: paragraphs,
      images: [],
      url,
    };
    stepDone(2);
    console.log('手动粘贴:', article.content.length, '段');

    // Step 3: 翻译
    stepCurrent(3);
    const translations = {};
    translations.title = await translateText(article.title);
    if (article.excerpt) translations.excerpt = await translateText(article.excerpt);
    translations.paragraphs = await translateBatch(article.content);
    stepDone(3);
    console.log('翻译完成:', translations.paragraphs.filter(Boolean).length, '段');

    // Step 4 & 5: 渲染 + 截图
    stepCurrent(4);
    stepCurrent(5);
    const dataUrl = await renderAndCapture(article, translations);
    stepDone(4);
    stepDone(5);

    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('result').classList.add('active');
    generatedImage = dataUrl;

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    document.getElementById('goBtn').textContent = '完成 (' + elapsed + 's)';
    document.getElementById('goBtn').disabled = true;

  } catch (err) {
    console.error(err);
    showError(err.message || '处理失败');
  }
}

function stepDone(n) {
  const el = document.getElementById('step' + n);
  el.classList.remove('current');
  el.classList.add('done');
}

function stepCurrent(n) {
  const el = document.getElementById('step' + n);
  el.classList.add('current');
}

function initSteps() {
  for (let i = 1; i <= 5; i++) {
    document.getElementById('step' + i).classList.remove('done', 'current');
  }
}

// ===================== CORS 代理（按优先级）=====================
// 用 Wayback Machine 时需要先解析跳转拿到真实地址
const CORS_PROXIES = [
  // 第一波：通用代理（成功率最高）
  (url) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
  (url) => 'https://corsproxy.io/?' + encodeURIComponent(url),
  // 第二波：归档/缓存（对付费墙更有效）
  (url) => 'https://web.archive.org/web/0/' + url,  // Wayback Machine 0 = 最新快照
  (url) => 'https://archive.org/wayback/available?url=' + encodeURIComponent(url),
  // 第三波：Google 缓存
  (url) => 'https://webcache.googleusercontent.com/search?q=cache:' + encodeURIComponent(url),
];

async function fetchProxied(url, timeout = 20000) {
  const errors = [];
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    const proxyFn = CORS_PROXIES[i];
    const proxyUrl = proxyFn(url);
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      const resp = await fetch(proxyUrl, { signal: controller.signal, redirect: 'follow' });
      clearTimeout(timer);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const text = await resp.text();

      // Wayback Machine 的 /web/0/ 路径会包含 iframe + 实际页面，需要提取
      if (proxyUrl.includes('web.archive.org/web/0/')) {
        // 直接抓的内容已经是正文部分
        if (text.length > 3000) {
          console.log('  ✓ Wayback Machine 抓取成功');
          return text;
        }
        throw new Error('Wayback 内容太短');
      }

      // archive.org/wayback/available 返回 JSON，需要二次抓取
      if (proxyUrl.includes('archive.org/wayback/available')) {
        const json = JSON.parse(text);
        const archived = json?.archived_snapshots?.closest?.url;
        if (!archived) throw new Error('无归档快照');
        console.log('  找到归档快照:', archived);
        const controller2 = new AbortController();
        const timer2 = setTimeout(() => controller2.abort(), timeout);
        const resp2 = await fetch(archived, { signal: controller2.signal });
        clearTimeout(timer2);
        const text2 = await resp2.text();
        if (text2.length > 3000) {
          console.log('  ✓ 通过归档快照抓取成功');
          return text2;
        }
        throw new Error('归档快照内容太短');
      }

      if (text.length > 3000) {
        console.log(`  ✓ 通过代理 ${i + 1} 抓取成功`);
        return text;
      }
      throw new Error('Response too short: ' + text.length);
    } catch (e) {
      errors.push(`代理 ${i + 1}: ${e.message}`);
      console.warn(`  ✗ 代理 ${i + 1} 失败: ${e.message}`);
    }
  }
  throw new Error('所有代理均失败\n' + errors.join('\n'));
}

// ===================== 正文提取 =====================
function extractArticle(html, url) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  const reader = new Readability(doc);
  const article = reader.parse();
  if (!article || !article.content) {
    throw new Error('无法从页面提取正文');
  }

  // 提取段落
  const contentDom = new DOMParser().parseFromString(article.content, 'text/html');
  const paragraphs = [];
  const seen = new Set();
  contentDom.body.querySelectorAll('p, h2, h3, h4, li, blockquote').forEach(el => {
    const text = el.textContent.trim();
    if (text.length < 15) return;
    const lower = text.toLowerCase();
    if (lower.includes('cookie') || lower.includes('advertisement') ||
        lower.includes('subscribe') || lower.includes('newsletter')) return;
    if (seen.has(text)) return;
    seen.add(text);
    paragraphs.push(text);
  });

  // 提取图片
  const images = [];
  contentDom.body.querySelectorAll('img').forEach(img => {
    const src = img.src || img.getAttribute('data-src');
    if (src && !src.startsWith('data:')) images.push(src);
  });

  return {
    title: article.title || '',
    byline: article.byline || '',
    excerpt: article.excerpt || '',
    siteName: article.siteName || '',
    content: paragraphs,
    images: images.slice(0, 2),
    url,
  };
}

// ===================== 翻译 =====================
async function translateBatch(texts) {
  const results = [];
  for (let i = 0; i < texts.length; i += 5) {
    const batch = texts.slice(i, i + 5);
    const combined = batch.join('\n\n---\n\n');
    const translated = await translateText(combined);
    const parts = translated.split(/\n*---\n*/).map(s => s.trim()).filter(Boolean);
    if (parts.length === batch.length) {
      results.push(...parts);
    } else {
      results.push(...batch.map(() => translated));
    }
  }
  return results;
}

async function translateText(text) {
  try {
    const url = 'https://translate.googleapis.com/translate_a/single' +
      '?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + encodeURIComponent(text);

    const resp = await fetch(url);
    const result = await resp.json();
    if (result?.[0]) {
      return result[0].map(part => part[0]).join('');
    }
  } catch (e) {
    console.error('Google Translate error:', e);
  }
  return '';
}

// ===================== 双语渲染 =====================
function buildBilingualHTML(article, translations) {
  const esc = (t) => {
    if (!t) return '';
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  };

  const { title, byline, excerpt, siteName, content, images, url } = article;
  const titleZh = translations.title || '';
  const excerptZh = translations.excerpt || '';
  const wordCount = content.join(' ').split(/\s+/).length;
  const readMin = Math.max(1, Math.round(wordCount / 200));
  const now = new Date();
  const dateStr = now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });

  let imagesHtml = '';
  images.forEach(src => {
    imagesHtml += '<div class="hi"><img src="' + esc(src) + '" alt="" style="width:100%;height:auto;border-radius:8px" /></div>';
  });

  let parasHtml = '';
  content.forEach((en, i) => {
    const zh = translations.paragraphs?.[i] || '';
    parasHtml += '<div class="pb"><p class="en">' + esc(en) + '</p>';
    if (zh) parasHtml += '<p class="zh">' + esc(zh) + '</p>';
    parasHtml += '</div>';
  });

  return '<div style="padding:40px 36px 60px">' +
    '<div class="st">' + esc(siteName || '新闻来源') + '</div>' +
    '<h1 class="te">' + esc(title) + '</h1>' +
    (titleZh ? '<h2 class="tz">' + esc(titleZh) + '</h2>' : '') +
    '<div class="meta">' +
      (byline ? '<span>' + esc(byline) + '</span>' : '') +
      '<span class="rt">' + readMin + ' 分钟阅读</span>' +
      '<span>' + dateStr + '</span>' +
    '</div>' +
    (excerpt ? '<div class="ex">' + esc(excerpt) + '</div>' : '') +
    (excerptZh ? '<div class="ez">' + esc(excerptZh) + '</div>' : '') +
    imagesHtml +
    parasHtml +
    '<div class="ft">' +
      '<div class="row"><span class="logo">双语速览</span><span>' + dateStr + '</span></div>' +
      '<div style="margin-top:8px;font-size:11px"><span>原文: </span><a href="' + esc(url) + '" target="_blank">' + esc(url.substring(0, 70)) + '...</a></div>' +
    '</div>' +
  '</div>';
}

// ===================== 截图 =====================
async function renderAndCapture(article, translations) {
  const area = document.getElementById('renderArea');
  area.innerHTML = buildBilingualHTML(article, translations);

  // 等待图片加载
  await new Promise(r => setTimeout(r, 1500));

  const canvas = await html2canvas(area, {
    scale: 2,
    useCORS: true,
    allowTaint: true,
    backgroundColor: '#faf9f6',
    logging: false,
  });

  area.innerHTML = '';
  return canvas.toDataURL('image/png');
}

// ===================== 主流程 =====================
async function startPipeline() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return;

  resetUI();
  initSteps();
  document.getElementById('progress').classList.add('active');
  document.getElementById('goBtn').disabled = true;
  document.getElementById('goBtn').textContent = '处理中...';
  document.getElementById('error').classList.remove('active');

  const startTime = Date.now();

  try {
    // Step 1: 抓取
    stepCurrent(1);
    const html = await fetchProxied(url);
    stepDone(1);
    console.log('Fetched HTML:', html.length, 'chars');

    // Step 2: 提取
    stepCurrent(2);
    const article = extractArticle(html, url);
    stepDone(2);
    console.log('Extracted:', article.content.length, 'paragraphs,', article.images.length, 'images');

    // Step 3: 翻译
    stepCurrent(3);
    const translations = {};
    translations.title = await translateText(article.title);
    if (article.excerpt) translations.excerpt = await translateText(article.excerpt);
    translations.paragraphs = await translateBatch(article.content);
    stepDone(3);
    console.log('Translated:', translations.paragraphs.filter(Boolean).length, 'of', translations.paragraphs.length, 'paragraphs');

    // Step 4: 渲染 + Step 5: 截图
    stepCurrent(4);
    stepCurrent(5);
    const dataUrl = await renderAndCapture(article, translations);
    stepDone(4);
    stepDone(5);

    // 显示结果
    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('result').classList.add('active');
    generatedImage = dataUrl;

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    document.getElementById('goBtn').textContent = '完成 (' + elapsed + 's)';
    document.getElementById('goBtn').disabled = true;

  } catch (err) {
    console.error(err);
    showError(err.message || '处理失败');
  }
}

// ===================== 下载/复制 =====================
function downloadImage() {
  if (!generatedImage) return;
  const a = document.createElement('a');
  a.href = generatedImage;
  a.download = 'bilingual-screenshot.png';
  a.click();
}

async function copyImage() {
  if (!generatedImage) return;
  try {
    const resp = await fetch(generatedImage);
    const blob = await resp.blob();
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ 已复制!';
    setTimeout(() => btn.textContent = '📋 复制图片', 2000);
  } catch (e) {
    alert('复制失败，请使用下载按钮');
  }
}

// 回车键触发
document.getElementById('urlInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startPipeline();
});

// URL 参数自动填充
(function() {
  const params = new URLSearchParams(window.location.search);
  const url = params.get('url');
  if (url) {
    document.getElementById('urlInput').value = url;
    startPipeline();
  }
})();
</script>
