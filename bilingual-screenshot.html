<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>双语速览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@mozilla/readability@0.5.0/Readability.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --paper: oklch(98% 0.009 85);
  --paper-warm: oklch(96% 0.012 75);
  --ink: oklch(18% 0.01 260);
  --ink-soft: oklch(35% 0.01 260);
  --ink-muted: oklch(55% 0.01 260);
  --ink-faint: oklch(78% 0.01 260);
  --accent: oklch(48% 0.1 15);
  --accent-soft: oklch(62% 0.12 15);
  --accent-bg: oklch(95% 0.04 20);
  --success: oklch(50% 0.12 140);
  --success-bg: oklch(95% 0.03 140);
  --danger: oklch(45% 0.12 20);
  --danger-bg: oklch(96% 0.02 20);
  --border: oklch(88% 0.01 85);
  --border-light: oklch(94% 0.008 85);
  --shadow: 0 1px 0 oklch(0% 0 0 / .04),0 0 0 1px oklch(0% 0 0 / .02);
  --radius: 4px;
  --font-display: "Newsreader", "Source Han Serif SC", "Noto Serif SC", Georgia, serif;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

html{background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
body{font-family:var(--font-ui);min-height:100dvh;display:flex;flex-direction:column}

/* ── 顶部装饰线 ── */
body::before{
  content:"";display:block;height:3px;
  background:var(--accent);
}

/* ── 头部 ── */
.site-header{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:32px 28px 0;
  max-width:680px;margin:0 auto;width:100%;
}
.site-header .wordmark{
  font-family:var(--font-display);
  font-size:clamp(1.6rem,3vw,2rem);
  font-weight:500;
  letter-spacing:-0.01em;
  color:var(--ink);
  line-height:1.2;
}
.site-header .wordmark span{
  font-weight:300;color:var(--ink-muted);
}
.site-header .notice{
  font-size:.75rem;color:var(--ink-muted);
  letter-spacing:.02em;
}

/* ── 主容器 ── */
.main-wrap{
  flex:1;display:flex;flex-direction:column;
  max-width:680px;margin:0 auto;width:100%;
  padding:28px 28px 48px;
}

/* ── 输入区：页面核心 ── */
.input-stage{
  display:flex;flex-direction:column;gap:12px;
  padding:40px 0;
}
.input-stage label{
  font-family:var(--font-display);
  font-size:1.05rem;font-weight:400;
  color:var(--ink-soft);
  letter-spacing:-.005em;
}
.input-stage .url-row{
  display:flex;gap:8px;width:100%;
}
.input-stage .url-row input{
  flex:1;
  font-family:var(--font-ui);
  font-size:.95rem;
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--paper-warm);
  color:var(--ink);
  outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.input-stage .url-row input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px oklch(95% 0.04 20 / .6);
}
.input-stage .url-row input::placeholder{
  color:var(--ink-faint);
}
.input-stage .url-row button{
  font-family:var(--font-ui);
  font-size:.9rem;font-weight:500;
  padding:14px 28px;
  background:var(--ink);
  color:var(--paper);
  border:none;border-radius:var(--radius);
  cursor:pointer;white-space:nowrap;
  letter-spacing:.01em;
  transition:background .15s,transform .1s;
}
.input-stage .url-row button:hover{background:var(--ink-soft)}
.input-stage .url-row button:active{transform:scale(.98)}
.input-stage .url-row button:disabled{opacity:.45;pointer-events:none}
.input-stage .hint{
  font-size:.8rem;color:var(--ink-muted);
  line-height:1.6;
}

/* ── 进度指示 ── */
.progress-panel{
  display:none;margin-bottom:28px;
}
.progress-panel.active{display:block}
.progress-panel .step{
  display:flex;align-items:center;gap:10px;
  padding:7px 0;
  font-size:.82rem;color:var(--ink-muted);
  transition:color .3s;
}
.progress-panel .step .dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--ink-faint);
  flex-shrink:0;
  transition:background .3s;
}
.progress-panel .step.done{color:var(--ink-soft)}
.progress-panel .step.done .dot{background:var(--ink-soft)}
.progress-panel .step.current{color:var(--ink)}
.progress-panel .step.current .dot{background:var(--accent);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* ── 错误提示 ── */
.error-panel{
  display:none;
  padding:14px 16px;margin-bottom:20px;
  background:var(--danger-bg);
  border-left:3px solid var(--danger);
  border-radius:0 var(--radius) var(--radius) 0;
  font-size:.85rem;color:var(--danger);
  line-height:1.6;
}
.error-panel.active{display:block}

/* ── 手动粘贴 ── */
.manual-panel{
  display:none;margin-bottom:28px;
  padding:20px;
  background:var(--paper-warm);
  border:1px solid var(--border);
  border-radius:var(--radius);
}
.manual-panel.active{display:block}
.manual-panel h2{
  font-family:var(--font-display);
  font-size:1rem;font-weight:500;margin-bottom:4px;
}
.manual-panel p{
  font-size:.8rem;color:var(--ink-muted);
  line-height:1.6;margin-bottom:14px;
}
.manual-panel input[type=text],
.manual-panel textarea{
  width:100%;padding:10px 12px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--paper);
  font-family:var(--font-ui);
  font-size:.85rem;color:var(--ink);
  margin-bottom:10px;outline:none;
  transition:border-color .15s;
}
.manual-panel input:focus,.manual-panel textarea:focus{
  border-color:var(--accent);
}
.manual-panel textarea{
  min-height:200px;resize:vertical;
  font-family:var(--font-display);
  font-size:.9rem;line-height:1.7;
}
.manual-panel .btn-row{
  display:flex;gap:8px;
}

/* ── 通用按钮 ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-ui);
  font-size:.82rem;font-weight:500;
  padding:10px 20px;border-radius:var(--radius);
  cursor:pointer;border:none;
  letter-spacing:.01em;
  transition:background .15s,transform .1s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:var(--ink-soft)}
.btn-secondary{background:var(--paper);color:var(--ink);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--paper-warm)}
.btn-accent{background:var(--accent);color:var(--paper)}
.btn-accent:hover{background:var(--accent-soft)}

/* ── 结果区 ── */
.result-stage{display:none;margin-bottom:28px}
.result-stage.active{display:block}
.result-stage .preview-frame{
  border:1px solid var(--border-light);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  margin-bottom:16px;
  background:var(--paper);
}
.result-stage .preview-frame img{
  width:100%;display:block;
}
.result-stage .btn-row{
  display:flex;gap:8px;flex-wrap:wrap;
}

/* ── 渲染区域（截图用，视口外） ── */
.render-area{
  position:fixed;left:-9999px;top:0;width:720px;
  background:var(--paper);
  font-family:var(--font-display);
}
.render-area .st{display:inline-block;font-size:12px;color:var(--ink-muted);background:var(--paper-warm);padding:3px 14px;border-radius:2px;margin-bottom:24px;font-family:var(--font-ui)}
.render-area .te{font-size:26px;font-weight:600;line-height:1.35;color:var(--ink);margin-bottom:10px;letter-spacing:-.01em}
.render-area .tz{font-size:18px;font-weight:400;line-height:1.5;color:var(--ink-soft);margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.render-area .meta{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--ink-muted);margin-bottom:28px;font-family:var(--font-ui);flex-wrap:wrap}
.render-area .meta .rt{background:var(--paper-warm);padding:2px 10px;border-radius:2px;font-weight:500;color:var(--ink-soft);white-space:nowrap}
.render-area .pb{margin-bottom:22px;padding-bottom:18px;border-bottom:1px dashed var(--border)}
.render-area .pb:last-child{border-bottom:none}
.render-area .en{font-size:17px;color:var(--ink);line-height:1.9;margin-bottom:10px}
.render-area .zh{font-size:14px;color:var(--ink-soft);line-height:1.85;padding-left:14px;border-left:2px solid var(--accent-bg);font-family:var(--font-ui)}
.render-area .ft{margin-top:48px;padding-top:24px;border-top:1px solid var(--border);font-size:12px;color:var(--ink-muted);font-family:var(--font-ui)}
.render-area .ft .row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.render-area .ft .logo{font-weight:600;color:var(--ink);font-size:13px}
.render-area .ft .learning{font-size:10px;color:var(--ink-muted);margin-top:8px}
.render-area .hi{margin-bottom:28px}
.render-area .hi img{width:100%;height:auto;border-radius:2px;display:block}

/* ── 页脚 ── */
.site-footer{
  font-size:.7rem;color:var(--ink-muted);
  text-align:center;padding:20px 28px 32px;
  max-width:680px;margin:0 auto;width:100%;
  letter-spacing:.02em;
}
.site-footer .divider{
  display:block;width:40px;height:1px;
  background:var(--border);margin:0 auto 16px;
}
</style>
</head>
<body>

<header class="site-header">
  <div class="wordmark">双语<span>速览</span></div>
  <div class="notice">仅供学习交流</div>
</header>

<main class="main-wrap">

  <!-- 输入区 -->
  <div class="input-stage" id="inputStage">
    <label for="urlInput">粘贴外媒报道链接，生成中英双语对照长图</label>
    <div class="url-row">
      <input type="url" id="urlInput" placeholder="https://www.scmp.com/news/..." autofocus />
      <button id="goBtn" onclick="startPipeline()">生成截图</button>
    </div>
    <p class="hint">支持 BBC · Reuters · SCMP · WSJ · NYT · Bloomberg · AP 等主流外媒。输出为长图 PNG，可在手机或电脑上阅读。</p>
  </div>

  <!-- 进度指示 -->
  <div class="progress-panel" id="progress">
    <div class="step" id="step1"><span class="dot"></span> 获取文章</div>
    <div class="step" id="step2"><span class="dot"></span> 提取正文</div>
    <div class="step" id="step3"><span class="dot"></span> 翻译对照</div>
    <div class="step" id="step4"><span class="dot"></span> 排版渲染</div>
    <div class="step" id="step5"><span class="dot"></span> 生成截图</div>
  </div>

  <!-- 错误 -->
  <div class="error-panel" id="error"></div>

  <!-- 手动粘贴 -->
  <div class="manual-panel" id="manualFallback">
    <h2>手动粘贴原文</h2>
    <p>自动获取未能成功。请在浏览器中打开原文，选中正文复制后粘贴到下方，系统将继续完成翻译与截图。</p>
    <input type="text" id="manualTitle" placeholder="原文标题" />
    <input type="text" id="manualByline" placeholder="作者或来源（选填）" />
    <input type="text" id="manualUrl" placeholder="原文链接（选填）" />
    <textarea id="manualText" placeholder="在此粘贴原文正文（支持纯文本或 HTML）"></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="processManual()">生成双语截图</button>
      <button class="btn btn-secondary" onclick="closeManual()">取消</button>
    </div>
  </div>

  <!-- 结果 -->
  <div class="result-stage" id="result">
    <div class="preview-frame">
      <img id="previewImg" alt="双语长截图" />
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="downloadBtn" onclick="downloadImage()">下载 PNG</button>
      <button class="btn btn-accent" id="copyBtn" onclick="copyImage()">复制到剪贴板</button>
      <button class="btn btn-secondary" id="newBtn" onclick="resetUI();scrollToInput()">重新生成</button>
    </div>
  </div>

</main>

<footer class="site-footer">
  <span class="divider"></span>
  仅供学习交流使用
</footer>

<!-- 隐藏渲染区 -->
<div class="render-area" id="renderArea"></div>

<script>
// ===================== 状态管理 =====================
let generatedImage = null;

function scrollToInput(){
  document.getElementById('inputStage').scrollIntoView({behavior:'smooth',block:'center'});
}

function resetUI(){
  document.getElementById('progress').classList.remove('active');
  document.getElementById('result').classList.remove('active');
  document.getElementById('error').classList.remove('active');
  document.getElementById('manualFallback').classList.remove('active');
  document.getElementById('renderArea').innerHTML='';
  document.getElementById('goBtn').disabled=false;
  document.getElementById('goBtn').textContent='生成截图';
  generatedImage=null;
}

function showError(msg){
  const el=document.getElementById('error');
  el.textContent=msg;
  el.classList.add('active');
  document.getElementById('goBtn').disabled=false;
  document.getElementById('goBtn').textContent='生成截图';

  if(msg.includes('代理')||msg.includes('抓取')||msg.includes('HTTP 4')||msg.includes('HTTP 5')){
    document.getElementById('manualUrl').value=document.getElementById('urlInput').value;
    document.getElementById('manualFallback').classList.add('active');
    setTimeout(()=>document.getElementById('manualFallback').scrollIntoView({behavior:'smooth',block:'center'}),150);
  }
}

function closeManual(){
  document.getElementById('manualFallback').classList.remove('active');
}

function stepDone(n){
  const el=document.getElementById('step'+n);
  el.classList.remove('current');el.classList.add('done');
}
function stepCurrent(n){
  const el=document.getElementById('step'+n);
  el.classList.add('current');
}
function initSteps(){
  for(let i=1;i<=5;i++){
    const el=document.getElementById('step'+i);
    el.classList.remove('done','current');
  }
}

// ===================== 抓取代理 =====================
const PROXIES=[
  url=>'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
  url=>'https://corsproxy.io/?'+encodeURIComponent(url),
  url=>'https://web.archive.org/web/0/'+url,
  url=>'https://archive.org/wayback/available?url='+encodeURIComponent(url),
  url=>'https://webcache.googleusercontent.com/search?q=cache:'+encodeURIComponent(url),
];

async function fetchProxied(url,timeout=20000){
  const errors=[];
  for(let i=0;i<PROXIES.length;i++){
    const proxyUrl=PROXIES[i](url);
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),timeout);
      const resp=await fetch(proxyUrl,{signal:ctrl.signal,redirect:'follow'});
      clearTimeout(t);
      if(!resp.ok)throw new Error('HTTP '+resp.status);
      const text=await resp.text();

      if(proxyUrl.includes('archive.org/wayback/available')){
        const json=JSON.parse(text);
        const archived=json?.archived_snapshots?.closest?.url;
        if(!archived)throw new Error('无归档快照');
        const c2=new AbortController();
        const t2=setTimeout(()=>c2.abort(),timeout);
        const r2=await fetch(archived,{signal:c2.signal});
        clearTimeout(t2);
        const t2text=await r2.text();
        if(t2text.length>3000)return t2text;
        throw new Error('归档快照内容太短');
      }

      if(text.length>3000)return text;
      throw new Error('内容太短');
    }catch(e){
      errors.push(e.message);
    }
  }
  throw new Error('无法获取文章内容');
}

// ===================== 正文提取 =====================
function extractArticle(html,url){
  const parser=new DOMParser();
  const doc=parser.parseFromString(html,'text/html');
  const reader=new Readability(doc);
  const article=reader.parse();
  if(!article||!article.content)throw new Error('无法从页面提取正文');

  const contentDom=new DOMParser().parseFromString(article.content,'text/html');
  const paragraphs=[],seen=new Set();
  contentDom.body.querySelectorAll('p,h2,h3,h4,li,blockquote').forEach(el=>{
    const text=el.textContent.trim();
    if(text.length<15)return;
    const lower=text.toLowerCase();
    if(lower.includes('cookie')||lower.includes('advertisement')||lower.includes('subscribe')||lower.includes('newsletter'))return;
    if(seen.has(text))return;
    seen.add(text);paragraphs.push(text);
  });

  const images=[];
  contentDom.body.querySelectorAll('img').forEach(img=>{
    const src=img.src||img.getAttribute('data-src');
    if(src&&!src.startsWith('data:'))images.push(src);
  });

  return{
    title:article.title||'',
    byline:article.byline||'',
    excerpt:article.excerpt||'',
    siteName:article.siteName||'',
    content:paragraphs,
    images:images.slice(0,2),
    url,
  };
}

// ===================== 翻译 =====================
async function translateText(text){
  try{
    const url='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+encodeURIComponent(text);
    const resp=await fetch(url);
    const result=await resp.json();
    if(result?.[0])return result[0].map(p=>p[0]).join('');
  }catch(e){}
  return'';
}

async function translateBatch(texts){
  const results=[];
  for(let i=0;i<texts.length;i+=5){
    const batch=texts.slice(i,i+5);
    const combined=batch.join('\n\n---\n\n');
    const translated=await translateText(combined);
    const parts=translated.split(/\n*---\n*/).map(s=>s.trim()).filter(Boolean);
    if(parts.length===batch.length)results.push(...parts);
    else results.push(...batch.map(()=>translated));
  }
  return results;
}

// ===================== 双语渲染 =====================
function buildBilingualHTML(article,translations){
  const esc=t=>{if(!t)return'';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
  const{title,byline,excerpt,siteName,content,images,url}=article;
  const titleZh=translations.title||'';
  const excerptZh=translations.excerpt||'';
  const wordCount=content.join(' ').split(/\s+/).length;
  const readMin=Math.max(1,Math.round(wordCount/200));
  const now=new Date();
  const dateStr=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});

  let imgs='';
  images.forEach(src=>{imgs+='<div class="hi"><img src="'+esc(src)+'" alt="" style="width:100%;height:auto;border-radius:2px" /></div>';});

  let paras='';
  content.forEach((en,i)=>{
    const zh=translations.paragraphs?.[i]||'';
    paras+='<div class="pb"><p class="en">'+esc(en)+'</p>';
    if(zh)paras+='<p class="zh">'+esc(zh)+'</p>';
    paras+='</div>';
  });

  return'<div style="padding:40px 36px 60px">'+
    '<div class="st">'+esc(siteName||'新闻来源')+'</div>'+
    '<h1 class="te">'+esc(title)+'</h1>'+
    (titleZh?'<h2 class="tz">'+esc(titleZh)+'</h2>':'')+
    '<div class="meta">'+
      (byline?'<span>'+esc(byline)+'</span>':'')+
      '<span class="rt">'+readMin+' 分钟阅读</span>'+
      '<span>'+dateStr+'</span>'+
    '</div>'+
    (excerpt?'<div class="ex">'+esc(excerpt)+'</div>':'')+
    (excerptZh?'<div class="ez">'+esc(excerptZh)+'</div>':'')+
    imgs+paras+
    '<div class="ft">'+
      '<div class="row"><span class="logo">双语速览</span><span>'+dateStr+'</span></div>'+
      '<div class="learning">仅供学习交流</div>'+
      '<div style="margin-top:6px;font-size:11px"><span>原文: </span><a href="'+esc(url)+'" target="_blank" style="color:inherit">'+esc(url.substring(0,70))+'...</a></div>'+
    '</div>'+
  '</div>';
}

// ===================== 截图 =====================
async function renderAndCapture(article,translations){
  const area=document.getElementById('renderArea');
  area.innerHTML=buildBilingualHTML(article,translations);
  await new Promise(r=>setTimeout(r,1500));
  const canvas=await html2canvas(area,{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#fcfaf7',logging:false});
  area.innerHTML='';
  return canvas.toDataURL('image/png');
}

// ===================== 主流程 =====================
async function startPipeline(){
  const url=document.getElementById('urlInput').value.trim();
  if(!url)return;

  resetUI();initSteps();
  document.getElementById('progress').classList.add('active');
  document.getElementById('goBtn').disabled=true;
  document.getElementById('goBtn').textContent='处理中…';
  document.getElementById('error').classList.remove('active');

  const t0=Date.now();

  try{
    stepCurrent(1);
    const html=await fetchProxied(url);
    stepDone(1);

    stepCurrent(2);
    const article=extractArticle(html,url);
    stepDone(2);

    stepCurrent(3);
    const translations={};
    translations.title=await translateText(article.title);
    if(article.excerpt)translations.excerpt=await translateText(article.excerpt);
    translations.paragraphs=await translateBatch(article.content);
    stepDone(3);

    stepCurrent(4);
    stepCurrent(5);
    const dataUrl=await renderAndCapture(article,translations);
    stepDone(4);stepDone(5);

    document.getElementById('previewImg').src=dataUrl;
    document.getElementById('result').classList.add('active');
    generatedImage=dataUrl;

    const elapsed=((Date.now()-t0)/1000).toFixed(1);
    document.getElementById('goBtn').textContent='完成（'+elapsed+'s）';
    document.getElementById('goBtn').disabled=true;

  }catch(err){
    console.error(err);
    showError(err.message||'处理失败');
  }
}

// ===================== 手动粘贴 =====================
async function processManual(){
  const title=document.getElementById('manualTitle').value.trim();
  const byline=document.getElementById('manualByline').value.trim();
  const url=document.getElementById('manualUrl').value.trim()||'手动粘贴';
  const rawText=document.getElementById('manualText').value.trim();
  if(!rawText){alert('请粘贴原文内容');return;}

  resetUI();initSteps();
  document.getElementById('progress').classList.add('active');
  document.getElementById('goBtn').disabled=true;
  document.getElementById('goBtn').textContent='处理中…';
  document.getElementById('error').classList.remove('active');

  const t0=Date.now();

  try{
    stepCurrent(1);
    await new Promise(r=>setTimeout(r,200));
    stepDone(1);

    stepCurrent(2);
    let paragraphs;
    if(rawText.trim().startsWith('<')){
      const doc=new DOMParser().parseFromString(rawText,'text/html');
      paragraphs=Array.from(doc.querySelectorAll('p,h2,h3,li')).map(el=>el.textContent.trim()).filter(t=>t.length>15);
    }else{
      paragraphs=rawText.split(/\n\s*\n+/).map(p=>p.trim()).filter(p=>p.length>15);
    }
    if(!paragraphs.length)throw new Error('粘贴的内容没有有效段落');
    const article={title:title||'手动粘贴的文章',byline,excerpt:paragraphs[0].substring(0,200),siteName:'手动粘贴',content:paragraphs,images:[],url};
    stepDone(2);

    stepCurrent(3);
    const translations={};
    translations.title=await translateText(article.title);
    if(article.excerpt)translations.excerpt=await translateText(article.excerpt);
    translations.paragraphs=await translateBatch(article.content);
    stepDone(3);

    stepCurrent(4);stepCurrent(5);
    const dataUrl=await renderAndCapture(article,translations);
    stepDone(4);stepDone(5);

    document.getElementById('previewImg').src=dataUrl;
    document.getElementById('result').classList.add('active');
    generatedImage=dataUrl;

    const elapsed=((Date.now()-t0)/1000).toFixed(1);
    document.getElementById('goBtn').textContent='完成（'+elapsed+'s）';
    document.getElementById('goBtn').disabled=true;

  }catch(err){
    console.error(err);
    showError(err.message||'处理失败');
  }
}

// ===================== 下载/复制 =====================
function downloadImage(){
  if(!generatedImage)return;
  const a=document.createElement('a');
  a.href=generatedImage;a.download='bilingual-screenshot.png';a.click();
}

async function copyImage(){
  if(!generatedImage)return;
  try{
    const resp=await fetch(generatedImage);
    const blob=await resp.blob();
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    const btn=document.getElementById('copyBtn');
    btn.textContent='已复制';
    setTimeout(()=>btn.textContent='复制到剪贴板',2000);
  }catch(e){alert('复制失败，请使用下载按钮');}
}

document.getElementById('urlInput').addEventListener('keydown',e=>{if(e.key==='Enter')startPipeline();});

(function(){
  const params=new URLSearchParams(window.location.search);
  const url=params.get('url');
  if(url){document.getElementById('urlInput').value=url;startPipeline();}
})();
